# ==============================================================================
# Render Blueprint (Pe același cont Render):
# 1. receptioner-ai-24-7 (FastAPI Agent AI Vocal & Text + Cal.com)
# 2. chatwoot-ce-crm (Chatwoot Community Edition Docker — API Tokens 100% Gratuite)
# 3. chatwoot-redis (Render Key-Value Free) & chatwoot-db (Render PostgreSQL Free)
# ==============================================================================

services:
  # 1. Serverul Principal Recepționer AI 24/7
  - type: web
    name: receptioner-ai-24-7
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: DEFAULT_TTS_VOICE
        value: ro-RO-AlinaNeural
      - key: CALCOM_API_KEY
        sync: false
      - key: CHATWOOT_API_URL
        sync: false
      - key: CHATWOOT_API_TOKEN
        sync: false

  # 2. Chatwoot Community Edition (Open-Source Docker pe același cont Render)
  - type: web
    name: chatwoot-ce-crm
    runtime: docker
    dockerfilePath: ./chatwoot_hf_space/Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: "3000"
      - key: POSTGRES_PORT
        value: "5432"
      - key: NODE_ENV
        value: production
      - key: RAILS_ENV
        value: production
      - key: INSTALLATION_ENV
        value: docker
      - key: DEFAULT_LOCALE
        value: ro
      - key: ENABLE_ACCOUNT_SIGNUP
        value: "true"
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      # Optimizări critice de memorie RAM pentru Render Free (512 MB RAM)
      - key: WEB_CONCURRENCY
        value: "0"
      - key: RAILS_MAX_THREADS
        value: "3"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: RUBY_GC_HEAP_GROWTH_FACTOR
        value: "1.05"
      - key: RUBY_GC_MALLOC_LIMIT
        value: "16777216"
      - key: RUBY_GC_OLDMALLOC_LIMIT
        value: "16777216"
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: POSTGRES_HOST
        fromDatabase:
          name: chatwoot-db
          property: host
      - key: POSTGRES_DATABASE
        fromDatabase:
          name: chatwoot-db
          property: database
      - key: POSTGRES_USERNAME
        fromDatabase:
          name: chatwoot-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: chatwoot-db
          property: password
      - key: DATABASE_URL
        fromDatabase:
          name: chatwoot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: chatwoot-redis
          property: connectionString

  # 3. Redis Gratuit pentru Chatwoot CE pe Render
  - type: redis
    name: chatwoot-redis
    plan: free
    ipAllowList: []

databases:
  # 4. PostgreSQL Gratuit pentru Chatwoot CE pe Render
  - name: chatwoot-db
    plan: free
    databaseName: chatwoot_production
    user: chatwoot
